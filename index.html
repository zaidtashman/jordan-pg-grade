<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PG Mapper</title>
    <meta http-equiv="refresh" content="0; url=maps/jordan/">
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #0F1419;
            color: #FFFFFF;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }
        .container {
            text-align: center;
        }
        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            border-top-color: #007A3D;
            animation: spin 1s ease-in-out infinite;
            margin: 0 auto 20px;
        }
        p {
            font-size: 16px;
            font-weight: 500;
            letter-spacing: 0.5px;
            color: rgba(255, 255, 255, 0.7);
        }
        a {
            color: #007A3D;
            text-decoration: none;
            border-bottom: 1px dotted #007A3D;
        }
        a:hover {
            color: #00994C;
            border-bottom-style: solid;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
    <script type="text/javascript">
        window.location.replace("maps/jordan/");
    </script>
</head>
<body>
    <div class="container">
        <div class="spinner"></div>
        <p>Redirecting to <a href="maps/jordan/">PG Mapper Jordan</a>...</p>
    </div>
</body>
</html>
